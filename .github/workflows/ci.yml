name: MidasTouch2 source consistency
on:
  push:
    branches: ["build/**", "release/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python scripts/build_single_file.py --check
      - run: python scripts/validate_single_file.py
