name: MedisTouch v2.8 source consistency
on:
  # Branch pushes regenerate and commit the distributable artifact; pull requests
  # only verify that the committed artifact already matches the modular source.
  push:
    branches: ["build/**", "release/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: midas_test
          POSTGRES_DB: midas_test
          POSTGRES_PASSWORD: midas_ci_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U midas_test -d midas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Verify committed single-file EA on pull requests
        if: github.event_name == 'pull_request'
        run: python scripts/build_single_file.py --check
      - name: Regenerate single-file EA on branch pushes
        if: github.event_name != 'pull_request'
        run: python scripts/build_single_file.py
      - name: Run structural and safety checks
        run: python scripts/validate_single_file.py
      - name: Run native deal attribution and position-ledger tests
        env:
          PYTHONPATH: backend/source
        run: |
          python -m pip install pytest
          python -m pytest backend/source/tools/tests/test_position_ledger_metrics.py backend/source/tools/tests/test_tester_deal_export_contract.py backend/source/tools/tests/test_ea_deal_accounting_contract.py backend/source/tools/tests/test_strategytune_position_ledger.py backend/source/tools/tests/test_cost_stress_monte_carlo.py backend/source/tools/tests/test_compare_mt5_variant_runs.py backend/source/tools/tests/test_compare_mt5_continuation_runs.py -q
      - name: Test continuation guardrails and durable execution recovery
        env:
          PYTHONPATH: backend/source
        run: |
          python -m pytest tests/research/test_fresh_sweep_additive_router_contract.py -q
          python -m pytest backend/source/medis_touch/tests/test_execution_recovery.py backend/source/medis_touch/tests/test_execution_recovery_faults.py backend/source/medis_touch/tests/test_execution_flow_invariants.py backend/source/medis_touch/tests/test_execution_governance_and_costs.py -q
      - name: Test StrategyTune session-row attribution and P&L reconciliation
        run: python -m pytest tests/research/test_strategytune_session_reconcile.py -q
      - name: Test confidence diagnostics OOS evaluator
        run: python -m pytest tests/research/test_confidence_diagnostics.py -q
      - name: Test canonical Midas bridge and account-wide margin admission
        env:
          PYTHONPATH: backend/source:backend/source/telegram-bridge
          MIDAS_TEST_POSTGRES_URL: postgresql+asyncpg://midas_test:midas_ci_test_only@localhost:5432/midas_test
        run: |
          python -m pip install -r backend/source/telegram-bridge/requirements.txt pytest pytest-asyncio
          python -m pytest backend/source/telegram-bridge -q
      - name: Test account-wide margin, broker retcode, and backend overlay contracts
        run: python -m pytest tests/research/test_margin_admission_contract.py tests/research/test_broker_retcode_contract.py tests/research/test_backend_source_overlay_contract.py -q
      - name: Commit deterministic generated EA when source changed
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          if ! git diff --quiet -- development/EA/MedisTouch_v2.8.mq5; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add development/EA/MedisTouch_v2.8.mq5
            git commit -m "build: regenerate consolidated MedisTouch v2.8 EA"
            git push
          fi
